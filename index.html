<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spotify - Your Favourite Music is Here</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://kit.fontawesome.com/f8409e00fa.js" crossorigin="anonymous"></script></head>
<body>
  <nav>
    <ul>
      <li class="brand"><img src="logo.png" alt="Spotify" /> Spotify</li>
      <li>Home</li>
      <li>About</li>
    </ul>
  </nav>

  <div class="container">
    <div class="songList">
      <h1>Best of NCS - No Copyright Sounds</h1>
      <div class="songItemContainer"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="controls">
      <i class="fas fa-random" id="shuffleBtn" title="Shuffle"></i>
      <i class="fas fa-step-backward fa-2x" id="previous"></i>
      <i class="far fa-play-circle fa-2x" id="masterPlay"></i>
      <i class="fas fa-step-forward fa-2x" id="next"></i>
      <i class="fas fa-redo" id="repeatBtn" title="Repeat"></i>
    </div>
    <input type="range" id="myProgressBar" min="0" value="0" max="100" />
    <div class="songInfo">
      <img src="play.gif" width="42px" alt="" id="gif" style="opacity:0;" />
      <span id="masterSongName">Select a song to play</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
